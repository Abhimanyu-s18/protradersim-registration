<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#22c55e" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="#22c55e" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#22c55e" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#22c55e" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="600" stroke="#22c55e" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="600" stroke="#22c55e" stroke-width="1"/>
  </g>
  
  <!-- Logo/Icon -->
  <g transform="translate(100, 230)">
    <circle cx="60" cy="60" r="55" fill="url(#accentGrad)" opacity="0.2"/>
    <circle cx="60" cy="60" r="45" fill="none" stroke="#22c55e" stroke-width="3"/>
    <path d="M35 60 L50 45 L65 55 L85 30" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="30" r="5" fill="#22c55e"/>
  </g>
  
  <!-- Text: ProTraderSIM -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="700" fill="#f8fafc" text-anchor="middle">ProTraderSIM</text>
  
  <!-- Subtitle -->
  <text x="600" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle">Professional Trading Simulation Platform</text>
  
  <!-- Decorative line -->
  <rect x="450" y="365" width="300" height="4" fill="url(#accentGrad)" rx="2"/>
  
  <!-- Feature badges - horizontal layout -->
  <g transform="translate(150, 410)">
    <rect width="260" height="55" fill="#1e293b" rx="8"/>
    <text x="130" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#22c55e" text-anchor="middle">✓ Demo Trading</text>
  </g>
  <g transform="translate(440, 410)">
    <rect width="260" height="55" fill="#1e293b" rx="8"/>
    <text x="130" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#22c55e" text-anchor="middle">✓ Real Markets</text>
  </g>
  <g transform="translate(730, 410)">
    <rect width="260" height="55" fill="#1e293b" rx="8"/>
    <text x="130" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#22c55e" text-anchor="middle">✓ Risk-Free</text>
  </g>
  
  <!-- URL badge -->
  <text x="600" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">protradersim.com</text>
</svg>